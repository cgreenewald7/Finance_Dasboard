name: macOS release
on:
  push:
    tags: ['v*-macos*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, check and archive
        env:
          BUDGETTRACKER_VERSION: '2.0.2'
          PYINSTALLER_STRICT_BUNDLE_CODESIGN_ERROR: '1'
        run: bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BudgetTracker-${{ runner.arch }}
          path: release/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create draft and attach both architectures
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "Budget Tracker 2.0.2 for macOS" --notes-file MACOS_RELEASE_NOTES.md
